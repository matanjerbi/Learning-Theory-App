name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests (logic + data)
        run: npm test

      - name: Sync web into Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Theory-App-v1.0.${BUILD_NUMBER}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: תאוריה בקטנה v1.0.${{ github.run_number }}
          body: |
            להתקנה: להוריד את קובץ ה-APK בטלפון ולפתוח אותו (צריך לאשר "התקנה ממקורות לא ידועים").
            גרסאות הבאות מתעדכנות מעל הקיימת — ההתקדמות נשמרת.
          files: out/*.apk
          make_latest: true
