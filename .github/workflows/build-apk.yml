name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # מאגר השאלות (משרד התחבורה, CC-BY) כפי שעובד ב-LAMED+ (MIT) — נעול לגרסה מסוימת
  LAMED_REPO: https://github.com/Sergey-Bar/lamed-plus.git
  LAMED_SHA: 729fb2a4d70d551ff6028ed902441d8048e8eef1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          npm install --no-audit --no-fund
          pip install pillow

      - name: Fetch question bank + images
        run: |
          mkdir lamed-plus && cd lamed-plus
          git init -q
          git remote add origin "$LAMED_REPO"
          git fetch -q --depth 1 origin "$LAMED_SHA"
          git checkout -q FETCH_HEAD
          cd ..
          python3 scripts/build-data.py lamed-plus www

      - name: Tests (logic + data)
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Signing key (created once, then reused so updates install over the old version)
        run: |
          mkdir -p keystore
          if [ -f keystore/theory.keystore.b64 ]; then
            base64 -d keystore/theory.keystore.b64 > keystore/theory.keystore
          else
            keytool -genkeypair -keystore keystore/theory.keystore -storepass theoryapp -keypass theoryapp \
              -alias theory -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Theory App, O=Personal, C=IL"
            base64 -w 76 keystore/theory.keystore > keystore/theory.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add keystore/theory.keystore.b64
            git commit -m "Add signing key"
            git push
          fi

      - name: Create Android project
        run: |
          npx cap add android
          python3 scripts/patch-android.py
          python3 scripts/make-icons.py
          npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Theory-App-v1.0.${BUILD_NUMBER}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: תאוריה בקטנה v1.0.${{ github.run_number }}
          body: |
            להתקנה: להוריד את קובץ ה-APK בטלפון ולפתוח אותו (צריך לאשר "התקנה ממקורות לא ידועים").
            גרסאות הבאות מתעדכנות מעל הקיימת — ההתקדמות נשמרת.
          files: out/*.apk
          make_latest: true
